services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: burrito-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - IMAGES=1
      - VOLUMES=1
      - POST=1
      - DELETE=1
    networks:
      - burrito-internal

  # build-only stub: the kernel containers themselves are created at
  # runtime by burrito through the docker socket proxy. This service
  # exists so the image can be built; it is never started by
  # `docker compose up` (see profile). Build it explicitly with:
  #   docker compose build burrito-kernel
  burrito-kernel:
    build:
      context: .
      dockerfile: Dockerfile.kernel
    image: burrito-kernel:latest
    container_name: burrito-kernel
    profiles:
      - donotstart

  burrito:
    build: .
    image: burrito:latest
    container_name: burrito
    restart: unless-stopped
    ports:
      - "8888:8000"
    # all variables below are overridable from the project's .env file
    # (see .env.example); the defaults match burrito's in-app defaults
    environment:
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://apollo.local:9999}
      # burrito manages the python-kernel containers through this proxy
      # (only used when PYTHON_BACKEND=jupyter-docker-kernels)
      - DOCKER_HOST=tcp://docker-proxy:2375
      - JUPYTER_RUNTIME_DIR=/tmp/jupyter-runtime
      # browser.search: bundled SearXNG by default; a BRAVE_API_KEY from
      # .env, when set, takes priority
      - SEARXNG_API_URL=${SEARXNG_API_URL:-http://searxng:8080}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      # python tool: available to the model, and/or always enabled
      # (bypasses the per-request tools-list check)
      - IS_PYTHON_TOOL_AVAILABLE=${IS_PYTHON_TOOL_AVAILABLE:-true}
      - IS_PYTHON_TOOL_ALWAYS_ENABLED=${IS_PYTHON_TOOL_ALWAYS_ENABLED:-false}
      - IS_BROWSER_TOOL_AVAILABLE=${IS_BROWSER_TOOL_AVAILABLE:-true}
      - IS_BROWSER_TOOL_ALWAYS_ENABLED=${IS_BROWSER_TOOL_ALWAYS_ENABLED:-false}
      # python kernel backend: jupyter-in-process (default) or
      # jupyter-docker-kernels (build the burrito-kernel image first)
      - PYTHON_BACKEND=${PYTHON_BACKEND:-jupyter-in-process}
      # model + harmony behaviour
      - DEFAULT_MODEL_NAME=${DEFAULT_MODEL_NAME:-openai/gpt-oss-20b}
      - MODEL_IDENTITY=${MODEL_IDENTITY:-default}
      - SYSTEM_MESSAGE_DATE_CONFIG=${SYSTEM_MESSAGE_DATE_CONFIG:-auto-utc}
      - PRUNE_REASONING=${PRUNE_REASONING:-true}
      # browser tool locale / language / timezone
      - BROWSER_LOCALE=${BROWSER_LOCALE:-en-GB}
      - BROWSER_LANGUAGE=${BROWSER_LANGUAGE:-en}
      - BROWSER_TIMEZONE=${BROWSER_TIMEZONE:-Europe/London}
      # container logs at info by default; set LOG_LEVEL=debug in .env
      # to restore the verbose in-app default
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # seconds to wait for the next token from the backend before
      # aborting the request
      - BACKEND_INTER_TOKEN_TIMEOUT=${BACKEND_INTER_TOKEN_TIMEOUT:-120}
      # /metrics protection (both empty = endpoint is open)
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN:-}
      - METRICS_IP_WHITELIST=${METRICS_IP_WHITELIST:-}
    volumes:
      - jupyter-runtime:/tmp/jupyter-runtime
    networks:
      - default
      - burrito-internal
    depends_on:
      - docker-proxy

  prometheus:
    image: prom/prometheus:latest
    container_name: burrito-prometheus
    restart: unless-stopped
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --web.enable-admin-api
    volumes:
      - ./buildstack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: burrito-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"

  valkey:
    image: valkey/valkey:latest # use the official Valkey image
    container_name: burrito-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    container_name: burrito-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-abc-123}
      - UWSGI_WORKERS=${UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${UWSGI_THREADS:-1}
      - REDIS_URL=redis://valkey:6379/0 
    depends_on:
      - valkey
    volumes:
      - ./buildstack/searxng/settings.yml:/etc/searxng/settings.yml
    ports:
      - "8080:8080"

volumes:
  grafana-storage:
  jupyter-runtime: # volume shared between 'burrito' and kernel containers

networks:
  burrito-internal:
    name: burrito-internal
    # kernels get normal bridge egress on this network: the python tool's
    # online/offline description is decided by the app's wikipedia probe,
    # which shares this network. Set `internal: true` to re-isolate the
    # kernels from the internet (the offline description will then apply).
