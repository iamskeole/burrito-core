services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: burrito-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - IMAGES=1
      - VOLUMES=1
      - POST=1
      - DELETE=1
    networks:
      - burrito-internal

  burrito-kernel:
    build:
      context: .
      dockerfile: Dockerfile.kernel
    image: burrito-kernel:latest
    profiles:
      - donotstart

  # 2. Update your main app
  burrito:
    build: .
    image: burrito:latest
    container_name: burrito
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://apollo.local:9999}
      - DOCKER_HOST=tcp://docker-proxy:2375
      - JUPYTER_RUNTIME_DIR=/tmp/jupyter-runtime
    volumes:
      - jupyter-runtime:/tmp/jupyter-runtime
    networks:
      - default
      - burrito-internal
    depends_on:
      - docker-proxy

  prometheus:
    image: prom/prometheus:latest
    container_name: burrito-prometheus
    restart: unless-stopped
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --web.enable-admin-api
    volumes:
      - ./buildstack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: burrito-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"

  valkey:
    image: valkey/valkey:latest # Use the official Valkey image
    container_name: burrito-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    container_name: burrito-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-abc-123}
      - UWSGI_WORKERS=${UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${UWSGI_THREADS:-1}
      - REDIS_URL=redis://valkey:6379/0 
    depends_on:
      - valkey
    volumes:
      - ./buildstack/searxng/settings.yml:/etc/searxng/settings.yml
    ports:
      - "8080:8080"

volumes:
  grafana-storage:
  jupyter-runtime: # The new volume shared between 'burrito' and kernel containers

networks:
  burrito-internal:
    name: burrito-internal
    internal: true # Creates a sandbox network with no internet access
