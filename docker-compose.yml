services:
  # 1. Provide an isolated, rootless Docker daemon
  dind:
    image: docker:24-dind # CHANGE 1: Use standard dind to restore cgroups & networking
    container_name: burrito-dind
    restart: unless-stopped
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      # Leaving this entirely empty disables TLS and forces unencrypted port 2375
      - DOCKER_TLS_CERTDIR=
    # CHANGE 2: Remove the "command:" override entirely. The image entrypoint will handle exposing 2375.
    volumes:
      - dind-storage:/var/lib/docker
      # CHANGE 3: Share a volume with the burrito app so DinD can see the connection files
      - jupyter-runtime:/tmp/jupyter-runtime
    networks:
      - default
      - burrito-internal

  # We add a "dummy" service just to ensure the kernel image is built during 'up --build'
  # This image is not used as a service, but is used by the 'burrito' app to spawn containers.
  kernel-builder:
    image: docker:24-cli
    container_name: burrito-kernel-builder
    environment:
      - DOCKER_HOST=tcp://dind:2375
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    # Wait for DinD to be ready, then build the kernel image into DinD's cache
    entrypoint: ["/bin/sh"]
    command: 
      - "-c"
      - "while ! docker info >/dev/null 2>&1; do sleep 1; done; docker build -t burrito-kernel:latest -f Dockerfile.kernel ."
    depends_on:
      - dind
    networks:
      - default
      - burrito-internal

  # 2. Update your main app
  burrito:
    build: .
    image: burrito:latest
    container_name: burrito
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://host.docker.internal:8888}
      - DOCKER_HOST=tcp://dind:2375
      # CHANGE 4: Tell Jupyter to put connection files in the shared volume
      - JUPYTER_RUNTIME_DIR=/tmp/jupyter-runtime
    volumes:
      # Mount the same shared volume
      - jupyter-runtime:/tmp/jupyter-runtime
    networks:
      - default
      - burrito-internal
    depends_on:
      dind:
        condition: service_started
      # Wait for the image to be fully built inside DinD before booting the app
      kernel-builder:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    container_name: burrito-prometheus
    restart: unless-stopped
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --web.enable-admin-api
    volumes:
      - ./buildstack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: burrito-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"

  valkey:
    image: valkey/valkey:latest # Use the official Valkey image
    container_name: burrito-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    container_name: burrito-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-abc-123}
      - UWSGI_WORKERS=${UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${UWSGI_THREADS:-1}
      - REDIS_URL=redis://valkey:6379/0 
    depends_on:
      - valkey
    volumes:
      - ./buildstack/searxng/settings.yml:/etc/searxng/settings.yml
    ports:
      - "8080:8080"

volumes:
  grafana-storage:
  dind-storage:   # Caches images/containers inside the dind daemon
  jupyter-runtime: # The new volume shared between 'burrito' and 'dind'

networks:
  burrito-internal:
    internal: true # Creates a sandbox network with no internet access
