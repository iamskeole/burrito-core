services:
  burrito:
    build: .
    image: burrito:latest
    container_name: burrito
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      - BACKEND_BASE_URL=${BACKEND_BASE_URL:-http://host.docker.internal:8888}
    command: uvicorn burrito.main:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  prometheus:
    image: prom/prometheus:latest
    container_name: burrito-prometheus
    restart: unless-stopped
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --web.enable-admin-api
    volumes:
      - ./buildstack/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: burrito-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    container_name: burrito-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  searxng:
    image: searxng/searxng:latest
    container_name: burrito-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-ultrasecretkey}
      - UWSGI_WORKERS=${UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${UWSGI_THREADS:-1}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./buildstack/searxng/settings.yml:/etc/searxng/settings.yml
    ports:
      - "8080:8080"

volumes:
  grafana-storage:
