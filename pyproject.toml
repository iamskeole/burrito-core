[project]
name = "burrito"
version = "0.1.0"
description = "Inference harness for OpenAI gpt-oss"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "anthropic>=0.83.0",
    "async-timeout>=5.0.1",
    "fastapi>=0.119.0",
    "gpt-oss>=0.0.9",
    "httpx>=0.28.1",
    "ipykernel>=7.0.1",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "notebook>=7.4.7",
    "openai>=2.5.0",
    "openai-harmony>=0.0.4",
    "playwright>=1.56.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "trafilatura>=2.0.0",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
burrito = ["common/prompts/*.md"]