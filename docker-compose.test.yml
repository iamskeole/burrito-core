services:
  burrito:
    volumes:
      # 1. Mount the live code into the container so your breakpoints map exactly!
      - ./:/app
      - jupyter-runtime:/tmp/jupyter-runtime
    ports:
      # 2. Expose port 5678 to your Mac so VSCode debugpy client can connect
      - "5678:5678"
    # 3. Dynamically install debugpy upon boot, freeze start until you hit F5 debugger, and then boot Uvicorn with auto-reload!
    command: ["sh", "-c", "uv pip install debugpy && python -m debugpy --wait-for-client --listen 0.0.0.0:5678 -m uvicorn burrito.main:app --host 0.0.0.0 --port 8000 --reload"]

# We don't redefine the proxy, volumes, or networks here; docker-compose automatically merges them from the core docker-compose.yml!